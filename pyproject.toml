[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    "artifacts",
    "data/cache",
    "data/dataset",
]

[tool.ruff.lint]
# Keep the repository gate focused on errors. Formatting is handled separately.
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
