extends:
  - ../../common/configs/model_common.yaml
  - ../config.yaml
model:
  attention:
    mode: sparse
    stage3_mode: sparse
    stage4_mode: dense
    stage3_sparse_neighbors: 32
    stage3_sparse_selection: metric
    stage3_use_map_context: false
    stage4_use_map_context: true
    position_bias: metric
    stage3_heads: 4
    stage4_heads: 8
    stage3_qk_dim: 128
    stage4_qk_dim: 256
training:
  output: artifacts/checkpoints/imf_ablation/attention_qk_small/seed_7
